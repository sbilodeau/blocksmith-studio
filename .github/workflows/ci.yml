name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model for the AI FR/EN evaluation (provider/model, e.g. ollama-cloud/gpt-oss:120b)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Unit and integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  package-smoke:
    name: Package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Never publish from CI and never look for a signing certificate (macOS builds are ad-hoc signed).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # electron-builder --dir --publish never: unpacked app only, no installer, no GH_TOKEN needed.
      - run: npm run package:dir

  ai-eval:
    name: AI FR/EN evaluation
    # Runs on PRs that touch AI code, and on demand. Skips quietly when the OLLAMA_API_KEY secret is not available
    # (forks never get secrets). PLAN 9.4.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      BLOCKSMITH_EVAL_MODEL: ${{ inputs.model || vars.AI_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide whether to run
        id: gate
        shell: bash
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "No OLLAMA_API_KEY secret: skipping the AI evaluation." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(src/main/services/ai/|src/shared/ai/|src/main/ipc/ai-|resources/data/ai-eval/|tests/ai-eval/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AI code changed: skipping the AI evaluation." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Run the evaluation
        if: steps.gate.outputs.run == 'true'
        run: npm run test:ai
      - name: Publish the report
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ai-eval-report.md ] || exit 0
          cat ai-eval-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file ai-eval-report.md --edit-last --create-if-none || true
          fi
